group = "com.sip.flutter.sip_sdk_flutter"
version = "1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url "https://gitee.com/comm2java/sipsdkaar/raw/main/" }
        flatDir {
            dirs '/Users/yangtao/development/project/SIPSDKAndroid/sipsdk/build/outputs/aar', '/Users/yangtao/development/project/SIPSDKAndroid/openh264/build/outputs/aar'
        }
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.11.1")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://gitee.com/comm2java/sipsdkaar/raw/main/" }
        flatDir {
            dirs '/Users/yangtao/development/project/SIPSDKAndroid/sipsdk/build/outputs/aar', '/Users/yangtao/development/project/SIPSDKAndroid/openh264/build/outputs/aar'
        }
    }
}

apply plugin: "com.android.library"

android {
    if (project.android.hasProperty("namespace")) {
        namespace = "com.sip.flutter.sip_sdk_flutter"
    }

    compileSdk = 34

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdk = 21
    }

    dependencies {
        testImplementation("junit:junit:4.13.2")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            testLogging {
                events "passed", "skipped", "failed", "standardOut", "standardError"
                outputs.upToDateWhen { false }
                showStandardStreams = true
            }
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    //implementation 'com.sip.sdk:sipsdk:1.0.32'
    implementation(name: "sipsdk-release", ext: "aar")
    implementation 'com.openh264:openh264api:1.0.6'
    //implementation(name: "openh264-release", ext: "aar")
}
